
openapi: 3.0.3

info:
  title: Reservas MID API
  description: |
    API de lógica de negocio para reservar y cancelar cupos
    en la plataforma de viajes compartidos Súbete.
    Integra Rutas, Pasajeros y reputación, y Open-Meteo.
    Este borrador describe las operaciones de negocio previstas.

    Los consumidores acceden al MID a través del gateway, que valida el JWT
    Bearer y los permisos aplicables. El gateway llama al MID con la cabecera
    interna x-gateway-secret, cuyo nombre es provisional. El MID comprueba el
    secreto compartido en las solicitudes de negocio. GET /health queda
    accesible sin cabecera para verificar la disponibilidad.
  version: 1.0.0

servers:
  - url: http://localhost:3002
    description: Dirección local del MID para desarrollo y diagnóstico. El acceso directo a las operaciones protegidas requiere la cabecera interna.

tags:
  - name: Reservas
    description: Operaciones de reserva y cancelación.
  - name: Clima
    description: Consulta de condiciones climáticas para los viajes.

security:
  - bearerAuth: []

paths:
  /reservas/reservar-cupo:
    post:
      operationId: reservarCuposEnRuta
      tags:
        - Reservas
      summary: Reservar cupos en una ruta
      description: |
        Ejecuta las validaciones de negocio en el siguiente orden:

        1. Consulta la ruta mediante el gateway.
        2. Verifica que la ruta esté abierta.
        3. Consulta el puntaje del pasajero.
        4. Bloquea pasajeros con insignia en_observacion.
        5. Evita reservas activas duplicadas para el pasajero y la ruta.
        6. Descuenta los cupos solicitados a la ruta.
        7. Calcula el costo correspondiente al pasajero.
        8. Crea la reserva en estado confirmada mediante el CRUD a través del gateway.

        Si falla la creación de la reserva después de descontar los cupos,
        debe ejecutar una compensación devolviendo los cupos a la ruta.

        Quedan por acordar la semántica de la actualización de varios cupos,
        el método de cálculo de distancia y la operación del CRUD que usará el MID
        para persistir una reserva confirmada.
      requestBody:
        required: true
        description: Identificadores y datos del tramo para el que se solicitan cupos.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudReserva'

      responses:
        '201':
          description: Reserva confirmada y desglose del costo calculado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaConfirmada'

        '400':
          $ref: '#/components/responses/ErrorResponse'

        '403':
          description: Pasajero bloqueado por reputación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Ruta o recurso no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '409':
          description: Conflicto de negocio, como una ruta cerrada, una reserva activa duplicada o falta de cupos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '503':
          description: Servicio dependiente no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reservas/{id}/cancelar:
    post:
      operationId: cancelarReserva
      tags:
        - Reservas
      summary: Cancelar una reserva
      description: |
        Cancela una reserva existente.

        1. Consulta la reserva en el CRUD a través del gateway.
        2. Verifica que no esté cancelada ni completada.
        3. Consulta la hora de salida de la ruta mediante el gateway.
        4. Si faltan menos de CANCELACION_TARDIA_MIN minutos,
           registra una penalización del 50% del costo.
        5. Cambia el estado a cancelada.
        6. Devuelve los cupos a la ruta mediante el gateway.

        Si la devolución de cupos falla después de cancelar,
        el sistema debe gestionar la compensación o recuperación
        para evitar inconsistencias.

        Responde 404 si la reserva no existe y 409 si ya está cancelada
        o completada. Queda por acordar cómo persistir la penalización
        junto con el cambio de estado.
      parameters:
        - $ref: '#/components/parameters/ReservaId'

      responses:
        '200':
          description: Estado de la cancelación, penalización y cantidad de cupos liberados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCancelacion'

        '404':
          $ref: '#/components/responses/ErrorResponse'

        '409':
          $ref: '#/components/responses/ErrorResponse'

        '503':
          $ref: '#/components/responses/ErrorResponse'

  /reservas/{id}/clima:
    get:
      operationId: consultarClimaDeReserva
      tags:
        - Clima
      summary: Consultar clima previsto para una reserva
      description: |
        Consulta las condiciones climáticas previstas para la salida
        del viaje mediante Open-Meteo.

        El MID obtiene la reserva y los datos de la ruta a través del gateway
        y consulta Open-Meteo directamente. El cliente selecciona la hora UTC
        que contiene la salida y requiere datos completos de esa hora.
        El cliente de clima está disponible. La integración de esta operación
        con los CRUD de Reservas y Rutas queda pendiente.

        Plan de degradación:
        - Plazo por intento y plazo total acotados.
        - Reintentos limitados para fallos transitorios.
        - Caché local por instancia con TTL, capacidad máxima y deduplicación de consultas concurrentes.
        - Ante un fallo de Open-Meteo, timeout, respuesta inválida, datos incompletos
          o salida fuera del horizonte, responde HTTP 200 con disponible false,
          motivo y mensaje.
        - La indisponibilidad del clima no impide reservar ni cancelar.
      parameters:
        - $ref: '#/components/parameters/ReservaId'

      responses:
        '200':
          description: Pronóstico disponible o resultado degradado por indisponibilidad de datos meteorológicos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaClima'

        '404':
          $ref: '#/components/responses/ErrorResponse'

        '503':
          description: No fue posible consultar la información de la ruta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT presentado al gateway. La cabecera interna que el gateway agrega al reenviar la solicitud se valida por separado en el MID.

  parameters:
    ReservaId:
      name: id
      in: path
      required: true
      description: Identificador único de la reserva.
      schema:
        type: string
      example: res-0001

  schemas:
    SolicitudReserva:
      type: object
      description: Datos para solicitar cupos de una ruta. La representación geográfica definitiva de abordaje y descenso queda pendiente.
      required:
        - rutaId
        - pasajeroId
        - cupos
        - abordaje
        - descenso
      properties:
        rutaId:
          type: string
          example: ruta-0001
        pasajeroId:
          type: string
          example: usr-12
        cupos:
          type: integer
          minimum: 1
          example: 1
        abordaje:
          type: string
          example: Universidad
        descenso:
          type: string
          example: Chapinero

    ReservaConfirmada:
      type: object
      description: Resultado de la reserva con el detalle del cálculo del costo.
      required:
        - mensaje
        - reserva
        - desgloseCosto
      properties:
        mensaje:
          type: string
          example: Reserva confirmada correctamente.
        reserva:
          $ref: '#/components/schemas/Reserva'
        desgloseCosto:
          $ref: '#/components/schemas/DesgloseCosto'

    Reserva:
      type: object
      description: Representación de la reserva incluida en la respuesta del MID.
      required:
        - id
        - ruta_id
        - pasajero_id
        - cupos
        - abordaje
        - descenso
        - costo
        - estado
        - penalizacion
      properties:
        id:
          type: string
          example: res-0001
        ruta_id:
          type: string
          example: ruta-0001
        pasajero_id:
          type: string
          example: usr-12
        cupos:
          type: integer
          example: 1
        abordaje:
          type: string
          example: Universidad
        descenso:
          type: string
          example: Chapinero
        costo:
          type: number
          format: double
          example: 4000
        estado:
          type: string
          enum:
            - pendiente
            - confirmada
            - cancelada
            - completada
          example: confirmada
        penalizacion:
          type: number
          format: double
          example: 0

    DesgloseCosto:
      type: object
      description: Valores usados para calcular el costo de los cupos reservados en el tramo.
      required:
        - precioTotalRuta
        - distanciaTramo
        - distanciaTotal
        - cuposTotales
        - cuposReservados
        - costoCalculado
      properties:
        precioTotalRuta:
          type: number
          example: 12000
        distanciaTramo:
          type: number
          description: Distancia estimada entre abordaje y descenso.
          example: 4.5
        distanciaTotal:
          type: number
          description: Distancia total del trazado de la ruta.
          example: 13.5
        cuposTotales:
          type: integer
          example: 3
        cuposReservados:
          type: integer
          example: 1
        costoCalculado:
          type: number
          example: 1333.33
        metodoDistancia:
          type: string
          description: Método para estimar la distancia del tramo. El valor mostrado es ilustrativo y el método definitivo está pendiente de acuerdo con el Grupo A.
          example: proporcion_puntos_trazado

    ResultadoCancelacion:
      type: object
      description: Resultado de cancelar la reserva y devolver los cupos de la ruta.
      required:
        - mensaje
        - reservaId
        - estado
        - penalizacion
        - cuposLiberados
        - cancelacionTardia
      properties:
        mensaje:
          type: string
          example: Reserva cancelada correctamente.
        reservaId:
          type: string
          example: res-0001
        estado:
          type: string
          enum:
            - cancelada
        penalizacion:
          type: number
          example: 2000
        cuposLiberados:
          type: integer
          example: 1
        cancelacionTardia:
          type: boolean
          example: true

    ConsultaClima:
      description: Resultado de la consulta, con un pronóstico o un motivo de indisponibilidad.
      oneOf:
        - $ref: '#/components/schemas/ClimaDisponible'
        - $ref: '#/components/schemas/ClimaNoDisponible'

    ClimaDisponible:
      type: object
      description: Pronóstico que contiene las mediciones de la hora seleccionada.
      required:
        - disponible
        - reservaId
        - temperatura
        - probabilidadPrecipitacion
        - codigoMeteorologico
        - condicion
        - fechaHoraPronostico
      properties:
        disponible:
          type: boolean
          enum: [true]
        reservaId:
          type: string
          example: res-0001
        salida:
          type: string
          format: date-time
          nullable: true
        temperatura:
          type: number
          description: Temperatura a 2 m en grados Celsius.
          example: 18.5
        probabilidadPrecipitacion:
          type: number
          description: Probabilidad porcentual para la hora anterior a la marca seleccionada.
          minimum: 0
          maximum: 100
          example: 75
        codigoMeteorologico:
          type: integer
          description: Código de interpretación meteorológica WMO reportado por Open-Meteo.
          example: 63
        condicion:
          type: string
          example: Lluvia moderada
        fechaHoraPronostico:
          type: string
          format: date-time
          description: Marca horaria seleccionada en UTC.
          example: '2026-11-23T11:00:00.000Z'
        mensaje:
          type: string

    ClimaNoDisponible:
      type: object
      description: Resultado degradado que explica la indisponibilidad sin adjuntar datos meteorológicos ficticios.
      additionalProperties: false
      required:
        - disponible
        - reservaId
        - motivo
        - mensaje
      properties:
        disponible:
          type: boolean
          enum: [false]
        reservaId:
          type: string
          example: res-0001
        salida:
          type: string
          format: date-time
          nullable: true
        motivo:
          type: string
          enum:
            - fuera_de_horizonte
            - sin_datos
            - respuesta_invalida
            - timeout
            - proveedor_no_disponible
        mensaje:
          type: string
          example: No hay datos meteorológicos completos para la hora de salida.

    Error:
      type: object
      description: Formato de error del contrato. El código y el mensaje son obligatorios y el detalle contextual es opcional.
      required:
        - codigo
        - mensaje
      properties:
        codigo:
          type: string
          description: Identificador del error para consumo programático.
          example: sin_cupos
        mensaje:
          type: string
          description: Mensaje legible que describe el error.
          example: No hay cupos disponibles para esta ruta.
        detalle:
          type: object
          description: Datos adicionales del error cuando están disponibles.
          additionalProperties: true

  responses:
    ErrorResponse:
      description: Error de la operación según el estado HTTP indicado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

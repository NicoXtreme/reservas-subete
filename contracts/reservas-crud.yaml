
openapi: 3.0.3

info:
  title: Reservas CRUD API
  description: |
    API de persistencia y consulta de reservas del clúster Súbete.
    Este borrador describe las operaciones de negocio previstas.

    Los consumidores acceden a través del gateway, que valida el JWT Bearer
    y los permisos aplicables. El gateway llama al CRUD con la cabecera interna
    x-gateway-secret. El nombre de esa cabecera es provisional. El CRUD comprueba
    el secreto compartido en las solicitudes de negocio. GET /health queda
    accesible sin cabecera para verificar la disponibilidad.
  version: 1.0.0

servers:
  - url: http://localhost:3001
    description: Dirección local del CRUD para desarrollo y diagnóstico. El acceso directo a las operaciones protegidas requiere la cabecera interna.

tags:
  - name: Reservas
    description: Operaciones CRUD sobre reservas

security:
  - bearerAuth: []

paths:
  /reservas:
    get:
      operationId: listarReservas
      tags:
        - Reservas
      summary: Consultar reservas
      description: |
        Lista reservas con filtros opcionales por pasajero, ruta y estado.
        Aplica paginación a los resultados. Responde 400 si los parámetros son inválidos.
      parameters:
        - name: usuarioId
          in: query
          required: false
          schema:
            type: string
          description: Identificador del pasajero.

        - name: rutaId
          in: query
          required: false
          schema:
            type: string
          description: Identificador de la ruta.

        - name: estado
          in: query
          required: false
          description: Estado por el cual se filtran las reservas.
          schema:
            $ref: '#/components/schemas/EstadoReserva'

        - name: page
          in: query
          required: false
          description: Número de página, empezando en 1.
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          required: false
          description: Cantidad máxima de reservas por página.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10

      responses:
        '200':
          description: Página de reservas y metadatos de paginación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaReservas'

        '400':
          $ref: '#/components/responses/ErrorResponse'

    post:
      operationId: crearReservaPendiente
      tags:
        - Reservas
      summary: Crear reserva
      description: |
        Crea una reserva en estado pendiente. La operación que usará el MID para
        persistir una reserva confirmada está pendiente de definición.
      requestBody:
        required: true
        description: Datos para registrar una reserva en estado pendiente.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearReserva'

      responses:
        '201':
          description: Reserva creada en estado pendiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'

        '400':
          $ref: '#/components/responses/ErrorResponse'

        '409':
          $ref: '#/components/responses/ErrorResponse'

  /reservas/{id}:
    get:
      operationId: obtenerReservaPorId
      tags:
        - Reservas
      summary: Consultar reserva por ID
      description: Recupera la reserva identificada por id. Responde 404 si no existe.
      parameters:
        - $ref: '#/components/parameters/ReservaId'

      responses:
        '200':
          description: Reserva encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'

        '404':
          $ref: '#/components/responses/ErrorResponse'

    delete:
      operationId: eliminarReservaPendiente
      tags:
        - Reservas
      summary: Eliminar reserva pendiente
      description: |
        Elimina una reserva solo si está pendiente. Responde 404 si no existe
        o 409 si su estado impide eliminarla.
      parameters:
        - $ref: '#/components/parameters/ReservaId'

      responses:
        '204':
          description: Reserva eliminada. La respuesta no lleva cuerpo.

        '404':
          $ref: '#/components/responses/ErrorResponse'

        '409':
          $ref: '#/components/responses/ErrorResponse'

  /reservas/{id}/estado:
    patch:
      operationId: actualizarEstadoReserva
      tags:
        - Reservas
      summary: Cambiar estado de una reserva
      description: |
        Transiciones permitidas:
        - pendiente -> confirmada
        - pendiente -> cancelada
        - confirmada -> completada
        - confirmada -> cancelada

        Una transición no permitida responde 409. El mecanismo para persistir
        una penalización durante la cancelación está pendiente de definición.
      parameters:
        - $ref: '#/components/parameters/ReservaId'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - estado
              properties:
                estado:
                  $ref: '#/components/schemas/EstadoReserva'

      responses:
        '200':
          description: Reserva con el estado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'

        '400':
          $ref: '#/components/responses/ErrorResponse'

        '404':
          $ref: '#/components/responses/ErrorResponse'

        '409':
          $ref: '#/components/responses/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT presentado al gateway. La cabecera interna que el gateway agrega al reenviar la solicitud se valida por separado en el CRUD.

  parameters:
    ReservaId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Identificador único de la reserva.

  schemas:
    EstadoReserva:
      type: string
      description: Estado de la reserva dentro del flujo de persistencia.
      enum:
        - pendiente
        - confirmada
        - cancelada
        - completada

    Reserva:
      type: object
      description: Representación de la reserva devuelta por el CRUD, con sus marcas de creación y actualización.
      required:
        - id
        - ruta_id
        - pasajero_id
        - cupos
        - abordaje
        - descenso
        - costo
        - estado
        - penalizacion
        - creado_en
        - actualizado_en
      properties:
        id:
          type: string
          example: res-0001

        ruta_id:
          type: string
          example: ruta-0001

        pasajero_id:
          type: string
          example: usr-12

        cupos:
          type: integer
          minimum: 1
          example: 1

        abordaje:
          type: string
          description: Identifica el punto de abordaje. La representación geográfica definitiva está pendiente.
          example: Universidad

        descenso:
          type: string
          description: Identifica el punto de descenso. La representación geográfica definitiva está pendiente.
          example: Chapinero

        costo:
          type: number
          format: double
          minimum: 0
          example: 4000

        estado:
          $ref: '#/components/schemas/EstadoReserva'

        penalizacion:
          type: number
          format: double
          minimum: 0
          example: 0

        creado_en:
          type: string
          format: date-time

        actualizado_en:
          type: string
          format: date-time

    CrearReserva:
      type: object
      description: Datos requeridos para crear una reserva pendiente.
      required:
        - ruta_id
        - pasajero_id
        - cupos
        - abordaje
        - descenso
        - costo
      properties:
        ruta_id:
          type: string
          example: ruta-0001

        pasajero_id:
          type: string
          example: usr-12

        cupos:
          type: integer
          minimum: 1
          example: 1

        abordaje:
          type: string
          example: Universidad

        descenso:
          type: string
          example: Chapinero

        costo:
          type: number
          minimum: 0
          example: 4000

    ListaReservas:
      type: object
      description: Resultados paginados de la consulta de reservas.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Reserva'

        pagination:
          type: object
          description: Metadatos que describen la página y el total de resultados.
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10
            total:
              type: integer
              example: 25
            totalPages:
              type: integer
              example: 3

    Error:
      type: object
      description: Formato de error del contrato. El código y el mensaje son obligatorios y el detalle contextual es opcional.
      required:
        - codigo
        - mensaje
      properties:
        codigo:
          type: string
          description: Identificador del error para consumo programático.
          example: reserva_no_encontrada
        mensaje:
          type: string
          description: Mensaje legible que describe el error.
          example: No se encontró la reserva solicitada.
        detalle:
          type: object
          description: Datos adicionales del error cuando están disponibles.
          additionalProperties: true

  responses:
    ErrorResponse:
      description: Error de la operación según el estado HTTP indicado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
